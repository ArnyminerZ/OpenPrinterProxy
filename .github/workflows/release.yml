name: Build release APK

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build and attach unsigned APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-37'

      - name: Build unsigned release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Attach APK to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk OpenPrinterProxy-unsigned.apk
          gh release upload "$RELEASE_TAG" OpenPrinterProxy-unsigned.apk --clobber
